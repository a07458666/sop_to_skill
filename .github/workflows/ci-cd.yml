name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個 deploy 執行，避免競爭
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python (ruff)
        run: ruff check parser.py executor.py optimizer.py evolve.py flowdiff.py mcp_server.py eval/ tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html simulator.html governance.html optimize.html

      - name: Check shared JS syntax
        run: node --check assets/app.js

  # ── Job 2: Test (executor + eval) ────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install pydantic pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run executor eval (compiled must beat baseline)
        run: python eval/run_eval.py --check

  # ── Job 3: Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
